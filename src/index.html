<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="XP.css">
  <style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
    font-family: "Tahoma", "Segoe UI", sans-serif;
    /* Native-app feel: normal arrow everywhere, no text selection */
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Nothing in the chrome should animate - real XP menus snap instantly */
  .window *, .menu-bar * {
    transition: none !important;
    animation: none !important;
  }

  .window {
    width: 100vw !important;
    height: 100vh !important;
    margin: 0 !important;
    padding: 0 0 3px 0 !important;      /* 3px XP frame at the bottom */
    background: #0054e3 !important;     /* Luna blue shows through the side/bottom margins */
    box-sizing: border-box !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;        /* transparent window would clip it anyway */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Title bar: back to XP.css proportions ---------- */
  .title-bar {
    -webkit-app-region: drag;
    margin: 0 !important;
    padding: 3px 5px 3px 3px !important;   /* was 6px 7px - this made it chunky */
    min-height: 21px;
    box-sizing: content-box;
    border-radius: 8px 8px 0 0 !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    cursor: default;
  }

  .title-bar-controls {
    -webkit-app-region: no-drag !important;
    display: flex;
    gap: 2px;
    margin: 0 !important;
  }

  .title-bar-controls button {
    -webkit-app-region: no-drag !important;
    cursor: default !important;          /* was pointer = the "clicky hand" */
    width: 21px;
    height: 21px;
    min-width: 21px !important;
    min-height: 21px !important;
    margin: 0 !important;
    padding: 0 !important;
    outline: none !important;
  }
  .title-bar-controls button:focus { outline: none !important; }

  /* ---------- Menu bar: flat XP style ---------- */
  .menu-bar {
    display: flex;
    flex: none;
    background-color: #ece9d8;
    margin: 0 3px !important;
    padding: 1px 0;
    font-size: 11px;
    line-height: 1;
    color: #000;
    -webkit-app-region: no-drag !important;
    cursor: default;
  }

  .menu-item {
    position: relative;
    padding: 3px 7px 4px;
    cursor: default;
  }

  .menu-item:hover,
  .menu-item.open {
    background-color: #316ac5;
    color: #fff;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 150px;
    padding: 2px;
    box-sizing: border-box;
    background-color: #fff;
    border: 1px solid #aca899;
    box-shadow: 2px 2px 2px rgba(0,0,0,0.4);
    z-index: 1000;
    color: #000;
  }

  .menu-item.open > .dropdown-content { display: block; }

  .dropdown-content .item {
    padding: 4px 24px 4px 22px;
    white-space: nowrap;
    cursor: default;
  }
  .dropdown-content .item:hover {
    background-color: #316ac5;
    color: #fff;
  }
  .dropdown-content .item.checked::before {
    content: "\2713";
    position: absolute;
    left: 8px;
  }
  .dropdown-content .sep {
    height: 1px;
    margin: 3px 2px;
    background: #aca899;
  }

  /* ---------- Game area ---------- */
  .window-body {
    flex: 1;
    padding: 0 !important;
    margin: 0 3px !important;
    border: none !important;
    outline: none !important;
    background-color: #008000 !important;
    overflow: auto;
  }

  .solitaire, #js-solitaire {
    width: 100%;
    height: 100%;
    background-color: #008000;
    box-sizing: border-box;
    padding: 10px;
  }

  .window__actions { display: none !important; }

  /* Win-animation canvas: pin it to the board's corner so it fits exactly
     (otherwise it sits 10px off and creates scroll bars) */
  #js-solitaire > canvas { top: 0; left: 0; }

  /* Touch: the board handles its own gestures (no scrolling, pinch or text callouts) */
  #js-solitaire, #js-solitaire * {
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Android ---------- */
  .android body { background: #0054e3 !important; }
  .android #menu-help { display: none; }                       /* scale options make no sense on a phone */
  .android #js-solitaire { max-width: 700px; margin: 0 auto; } /* board stays centred on wide screens */

  /* Landscape layout: stock + waste on the left, tableau in the middle, foundations 2x2 on the right.
     Frees up ~140px of height so the cards can be drawn much bigger. */
  .android.wide #js-solitaire { max-width: 940px; }
  .android.wide .deck { top: 20px; }
  .android.wide .deck__deal { left: 0; top: 120px; }
  .android.wide .board-deck { top: 20px; left: 100px; }
  .android.wide .finish-deck { top: 20px; left: 737px; width: 182px; }
  .android.wide .finish-deck .aces { margin-bottom: 20px; }
  /* keep the title bar and menu a comfortable finger size whatever the board scale is */
  .android .title-bar, .android .menu-bar { zoom: var(--chrome-zoom, 1); }
</style>
</head>
<body>
  <div class="window">
    <div class="title-bar" data-tauri-drag-region>
      <div class="title-bar-text" data-tauri-drag-region>Solitaire</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize" id="min-btn"></button>
        <button aria-label="Maximize" id="max-btn"></button>
        <button aria-label="Close" id="close-btn"></button>
      </div>
    </div>

    <!-- XP Menu bar -->
    <div class="menu-bar" id="menu-bar">
      <div class="menu-item">
        <span>Game</span>
        <div class="dropdown-content">
          <div class="item" id="menu-new-game">New Game</div>
          <div class="sep"></div>
          <div class="item" id="menu-exit">Exit</div>
        </div>
      </div>
      <div class="menu-item" id="menu-help">
        <span>Help</span>
        <div class="dropdown-content">
          <div class="item checked" id="scale-10">1.0x Scale</div>
          <div class="item" id="scale-15">1.5x Scale</div>
          <div class="item" id="scale-20">2.0x Scale</div>
        </div>
      </div>
    </div>

    <div class="window-body">
      <div class="solitaire" id="js-solitaire">
        <!-- Hidden DOM element for solitairemain.js logic target -->
        <div class="window__actions">
          <button type="button" id="js-reset" class="new-game">New game</button>
        </div>
        <div id="js-finish" class="finish-deck"></div>
        <div id="js-board" class="board-deck"></div>
        <div class="deck">
          <div id="js-deck-pile" class="deck__pile"></div>
          <div id="js-deck-deal" class="deck__deal"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="solitairemain.js"></script>
  <script>
    // Window-control bridge: Android (MainActivity.kt) or Tauri desktop
    (() => {
      const A = window.AndroidBridge;          // injected by MainActivity.kt

      if (A) {
        document.documentElement.classList.add('android');
        document.querySelectorAll('[data-tauri-drag-region]').forEach(el => el.removeAttribute('data-tauri-drag-region'));
        window.windowControls = {
          minimize: () => A.minimize(),              // back to the home screen, game stays as it is
          maximize: () => A.toggleFullscreen(),      // fullscreen on/off
          close: () => A.closeAndClearCache(),       // clear cache and close the app
          setScale: () => {}
        };

        // Fit the board to the window; re-runs on rotation and fullscreen.
        // Portrait layout is 700x480, landscape layout is 940x340 (board only, in CSS px).
        const meta = document.querySelector('meta[name=viewport]');
        const CHROME_ZOOM_DP = 1.5;      // physical size of title bar / menu: 1 CSS px = 1.5dp
        const CHROME_DP = 70;            // title bar + menu bar height at that size
        const fit = () => {
          const [w, h] = String(A.windowSizeDp()).split(',').map(Number);
          if (!w || !h) return;
          const avail = h - CHROME_DP;
          const sNormal = Math.min(w / 700, avail / 480);
          const sWide = Math.min(w / 940, avail / 340);
          const wide = sWide > sNormal;
          const sc = Math.max(sNormal, sWide);
          document.documentElement.classList.toggle('wide', wide);
          const content = `width=${Math.round(w / sc)}, user-scalable=no, viewport-fit=cover`;
          if (meta.content !== content) meta.content = content;
          document.documentElement.style.setProperty('--chrome-zoom', (CHROME_ZOOM_DP / sc).toFixed(3));
        };
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
        setInterval(fit, 1000);
      } else {
        const { getCurrentWindow } = window.__TAURI__.window;
        const { getCurrentWebview } = window.__TAURI__.webview;
        const { LogicalSize } = window.__TAURI__.dpi;
        const win = getCurrentWindow();
        window.windowControls = {
          minimize: () => win.minimize(),
          maximize: () => win.toggleMaximize(),
          close: () => win.close(),
          setScale: async (scale) => {
            await win.setSize(new LogicalSize(Math.round(800 * scale), Math.round(600 * scale)));
            await getCurrentWebview().setZoom(scale);
          }
        };
      }
    })();
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Window controls
      document.getElementById('min-btn')?.addEventListener('click', () => window.windowControls?.minimize());
      document.getElementById('max-btn')?.addEventListener('click', () => window.windowControls?.maximize());
      document.getElementById('close-btn')?.addEventListener('click', () => window.windowControls?.close());

      // ---- XP menu behaviour: click to open, hover to switch, click away to close ----
      const bar = document.getElementById('menu-bar');
      const menus = [...bar.querySelectorAll('.menu-item')];
      let menuActive = false;

      const closeAll = () => {
        menus.forEach(m => m.classList.remove('open'));
        menuActive = false;
      };
      const openMenu = (m) => {
        menus.forEach(x => x.classList.toggle('open', x === m));
        menuActive = true;
      };

      menus.forEach(m => {
        m.addEventListener('mousedown', (e) => {
          if (e.target.closest('.dropdown-content')) return;   // clicks on items handled below
          m.classList.contains('open') ? closeAll() : openMenu(m);
        });
        m.addEventListener('mouseenter', () => { if (menuActive) openMenu(m); });
      });

      // Click outside the menu bar closes it; so does Escape or losing focus
      document.addEventListener('mousedown', (e) => { if (!bar.contains(e.target)) closeAll(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
      window.addEventListener('blur', closeAll);

      // Picking an item runs it, then closes the menu (like real XP)
      bar.querySelectorAll('.dropdown-content .item').forEach(item => {
        item.addEventListener('click', () => closeAll());
      });

      // Menu actions
      document.getElementById('menu-new-game')?.addEventListener('click', () => {
        document.getElementById('js-reset')?.click();
      });
      document.getElementById('menu-exit')?.addEventListener('click', () => window.windowControls?.close());

      // Scale options, with a tick next to the active one
      const scales = { 'scale-10': 1.0, 'scale-15': 1.5, 'scale-20': 2.0 };
      Object.entries(scales).forEach(([id, value]) => {
        document.getElementById(id)?.addEventListener('click', () => {
          Object.keys(scales).forEach(k => document.getElementById(k).classList.toggle('checked', k === id));
          window.windowControls?.setScale(value);
        });
      });
    });
  </script>

  <script>
    // Touch support: the game only listens for mouse events, so on the board we
    // translate one-finger touches into the equivalent mouse events.
    (() => {
      const board = document.getElementById('js-solitaire');
      let t = null;   // the finger currently being tracked

      const mouse = (type, tc) => new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window, button: 0,
        buttons: (type === 'mouseup' || type === 'click') ? 0 : 1,
        clientX: tc.clientX, clientY: tc.clientY, screenX: tc.screenX, screenY: tc.screenY
      });
      const finger = (e) => t && [...e.changedTouches].find(x => x.identifier === t.id);

      board.addEventListener('touchstart', (e) => {
        if (t) return;                         // ignore extra fingers
        const tc = e.changedTouches[0];
        e.preventDefault();                    // no scrolling, no emulated mouse events
        t = { id: tc.identifier, x0: tc.clientX, y0: tc.clientY, moved: false, target: e.target };
        e.target.dispatchEvent(mouse('mousedown', tc));
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        const tc = finger(e); if (!tc) return;
        e.preventDefault();
        if (Math.hypot(tc.clientX - t.x0, tc.clientY - t.y0) > 4) t.moved = true;
        window.dispatchEvent(mouse('mousemove', tc));
      }, { passive: false });

      const end = (e) => {
        const tc = finger(e); if (!tc) return;
        e.preventDefault();
        const under = document.elementFromPoint(tc.clientX, tc.clientY) || t.target;
        under.dispatchEvent(mouse('mouseup', tc));
        if (e.type === 'touchend' && !t.moved) t.target.dispatchEvent(mouse('click', tc));   // a tap
        t = null;
      };
      window.addEventListener('touchend', end, { passive: false });
      window.addEventListener('touchcancel', end, { passive: false });
    })();
  </script>
</body>
</html>
